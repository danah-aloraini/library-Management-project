{% extends "accounts/layout.html" %} {% block title %}Delete Book{% endblock %}
{% block body %}

<div class="container mt-5">
  <h2>Delete Book</h2>

  <div class="card mt-4">
    <div class="card-body">
      <h3>Are you sure you want to delete "{{ book.title }}"?</h3>

      <p>This action cannot be undone.</p>

      <form method="post">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">Yes, Delete</button>

        <a
          href="{% url 'accounts:book_detail_view' book.id %}"
          class="btn btn-secondary"
        >
          Cancel
        </a>
      </form>
    </div>
  </div>
</div>

{% endblock %}
