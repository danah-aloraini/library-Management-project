{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Library Menu{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/styles.css' %}">
</head>
<body>

    <nav class="library-menu">
        <div class="menu-container">

            <a class="menu-logo" href="{% url 'accounts:login_view' %}">
                <img src="{% static 'accounts/library-logo.jfif' %}" alt="Website Logo">
            </a>

            <div class="menu-links">
                {% if request.user.is_authenticated %}
                    <a class="menu-link" href="{% url 'accounts:book_list_view' %}">All Books</a>
                    <a class="menu-link" href="{% url 'accounts:add_book_view' %}">Add Book</a>
                    <a class="menu-link" href="{% url 'accounts:logout_view' %}">Logout</a>
                {% else %}
                    <a class="menu-link" href="{% url 'accounts:login_view' %}">Login</a>
                    <a class="menu-link" href="{% url 'accounts:register_view' %}">Register</a>
                {% endif %}
            </div>

        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="message {% if message.tags %}message-{{ message.tags }}{% else %}message-info{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block body %}{% endblock %}
    </div>

</body>
</html>
