{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Library Menu{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'accounts/styles.css' %}">
</head>
<body>


    <nav class="library-Menu">
        <div class="Menu-container">


            <a class="Menu-logo" href="{% url 'accounts:login_view' %}">
                <img src="{% static 'accounts/library-logo.jfif' %}" alt="Website Logo">
            </a>


            <div class="Menu-links">

                <a class="Menu-link" href="{% url 'accounts:login_view' %}">Login</a>
                <a class="Menu-link" href="{% url 'accounts:register_view' %}">Register</a>
                {% comment %}
                <a class="Menu-link" href="{% url 'books:index' %}">All Books</a>
                <a class="Menu-link" href="{% url 'books:add' %}">Add Book</a>
                {% endcomment %}

            </div>

        </div>
    </nav>

    <div class="container ">
        {% block body %}{% endblock %}
    </div>

</body>
</html>
