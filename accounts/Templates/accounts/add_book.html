{% extends 'accounts/layout.html' %}

{% block title %}Add Book{% endblock %}

{% block body %}

<div class="container mt-5">
    <h2>Add New Book</h2>

    <div class="card mt-4">
        <div class="card-body">

            <form method="post" class="book-form">
                {% csrf_token %}
                {% for field in form %}
                    <div class="book-field">
                        <label for="{{ field.id_for_label }}" class="book-label">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                            <div class="book-error">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary">Add Book</button>
                <a href="{% url 'accounts:book_list_view' %}" class="btn btn-secondary">Cancel</a>
            </form>

        </div>
    </div>
</div>

{% endblock %}
