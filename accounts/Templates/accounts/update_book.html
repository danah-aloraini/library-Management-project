{% extends "accounts/layout.html" %}

{% block title %}Update Book{% endblock %}

{% block body %}

<div class="container mt-5">

    <h2>Update Book</h2>

    <div class="card mt-4">
        <div class="card-body">

            <h3>{{ book.title }}</h3>

            <form method="post" class="book-form">
                {% csrf_token %}
                {% for field in form %}
                    <div class="book-field">
                        <label for="{{ field.id_for_label }}" class="book-label">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}
                            <div class="book-error">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-warning">
                    Save Changes
                </button>

                <a href="{% url 'accounts:book_detail_view' book.id %}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </form>

        </div>
    </div>

</div>

{% endblock %}
